[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "tabular-data-monitor"
version = "0.2.0"
description = "Schema validation and distribution drift checks for tabular datasets"
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["numpy>=1.26", "pandas>=2.1", "scipy>=1.11"]

[project.optional-dependencies]
api = ["fastapi>=0.111", "python-multipart>=0.0.9", "uvicorn>=0.29"]
storage = ["sqlalchemy>=2.0"]
dev = ["pytest>=8.2", "pytest-cov>=5", "ruff>=0.4"]

[tool.setuptools]
packages = ["tabular_monitor"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

