[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-data-quality-monitoring-framework"
version = "0.1.0"
description = "Enterprise data quality, drift, and AI model monitoring framework."
readme = "README.md"
requires-python = ">=3.10"
authors = [{ name = "Enterprise MLOps Team" }]
dependencies = [
  "fastapi>=0.111.0",
  "uvicorn[standard]>=0.29.0",
  "pandas>=2.1.0",
  "numpy>=1.26.0",
  "scipy>=1.11.0",
  "scikit-learn>=1.4.0",
  "pydantic>=2.7.0",
  "pydantic-settings>=2.2.0",
  "python-multipart>=0.0.9",
  "pyyaml>=6.0.1",
  "sqlalchemy>=2.0.0",
  "psycopg2-binary>=2.9.9",
  "apscheduler>=3.10.4",
  "requests>=2.32.0",
  "streamlit>=1.35.0",
  "plotly>=5.22.0",
  "great-expectations>=0.18.12",
  "evidently>=0.4.30",
  "pyspark>=3.5.0"
]

[project.optional-dependencies]
dev = [
  "pytest>=8.2.0",
  "pytest-cov>=5.0.0",
  "ruff>=0.4.4",
  "mypy>=1.10.0",
  "httpx>=0.27.0"
]

[tool.setuptools]
packages = [
  "alerts",
  "api",
  "data_quality",
  "drift_detection",
  "monitoring"
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = ["E501"]

